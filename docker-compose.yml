services:
  db:
    image: postgres:16
    container_name: purplle-db
    environment:
      POSTGRES_DB: purplle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d purplle"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: purplle-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/purplle
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    container_name: purplle-frontend
    working_dir: /frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/frontend
    command: sh -c "npm install && npm run dev"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
